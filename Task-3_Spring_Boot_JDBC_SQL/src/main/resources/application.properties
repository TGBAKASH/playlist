# =========================================================
# Spring Boot & Database Configuration (Neon PostgreSQL & H2 Fallback)
# =========================================================
server.port=${PORT:8080}

# Cloud Neon PostgreSQL with local H2 fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:musicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Enable H2 Web Console when running locally
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Initialize SQL scripts (schema.sql and data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.vibzz=INFO
logging.level.org.springframework.jdbc.core=INFO
