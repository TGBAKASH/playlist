# =========================================================
# Render Blueprint Configuration (render.yaml)
# Single-container deployment: Spring Boot + Static Web + Neon PostgreSQL
# =========================================================
services:
  - type: web
    name: harris-jayaraj-playlist-suite
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string here
